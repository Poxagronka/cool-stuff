app = "cool-stuff"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/links.db"
  VAULT_PATH = "/data/vault"
  # the telethon user session for the saved-messages pull. on the volume
  # because the root filesystem is ephemeral and nobody can sign in up here
  TG_SESSION = "/data/backfill.session"
  # minutes between saved-messages pulls. the app checks this on a wake, it
  # never sits on a timer: a suspended machine has no clock. 0 turns the
  # schedule off and leaves only POST /api/saved/pull
  SAVED_EVERY_MINUTES = "180"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  # no http checks on purpose: the proxy would poll /health every minute and
  # the machine would never be idle long enough to suspend

[mounts]
  source = "links_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # everything on the machine adds up to about 100mb resident, and the heavy
  # end — the backfill — runs from the laptop and never lands here. half a gig
  # was paying for empty space, awake and in the suspend snapshot both
  memory = "256mb"
